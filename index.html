<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar · Observación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>
/* Fuentes corporativas Hockey España. Si se retiran los archivos, cae a Archivo y la app funciona igual. */
@font-face{font-family:"Redstick";src:url(fonts/redstick.otf);font-display:swap}
@font-face{font-family:"CfgBlack";src:url(fonts/configblack.ttf);font-display:swap}
@font-face{font-family:"CfgText";src:url(fonts/configtext.ttf);font-display:swap}
/* Hockey España · Radar de Desarrollo Individual.
   Layout: una columna de 720px, lista de ítems plegables; el nivel se elige leyendo su descriptor.
   Los cuatro niveles usan una rampa de un solo tono (claro -> oscuro): son momentos del desarrollo, no un semáforo. */
:root{
  --rojo:#E4002B; --rojo-hover:#B80023;
  --papel:#F6F2F1; --carta:#FFFFFF; --carta-2:#EFEAE9;
  --tinta:#1A1948; --tinta-suave:#6F6668; --linea:#E6E0E0;
  --n1-bg:#EDE9E9; --n1-tx:#6F6668; --n2-bg:#C9C6D8; --n2-tx:#2B2974;
  --n3-bg:#2B2974; --n3-tx:#FFFFFF; --n4-bg:#1A1948; --n4-tx:#FFFFFF;
  --sin-bg:#FFFFFF; --sin-tx:#8E8688;
  --ok:#1F6B4F; --aviso:#8A5A12;
  --font-display:'Redstick','CfgBlack','Archivo','Helvetica Neue',Arial,sans-serif;
  --font-body:'CfgText','Archivo','Helvetica Neue',Arial,sans-serif;
  --font-fuerte:'CfgBlack','Archivo','Helvetica Neue',Arial,sans-serif;
  --r:10px; --sombra:0 1px 2px rgba(23,24,27,.06),0 8px 24px rgba(23,24,27,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --papel:#0C0B26; --carta:#1A1948; --carta-2:#221F55;
  --tinta:#F6F2F1; --tinta-suave:#A9A5BE; --linea:#2B2974;
  --n1-bg:#221F55; --n1-tx:#A9A5BE; --n2-bg:#3B3886; --n2-tx:#EDEAF4;
  --n3-bg:#9D99C4; --n3-tx:#0C0B26; --n4-bg:#F6F2F1; --n4-tx:#0C0B26;
  --sin-bg:#1A1948; --sin-tx:#8F8BA8;
  --rojo:#FF5A6E; --rojo-hover:#FF7585; --ok:#7FD0A8; --aviso:#FBC600;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --papel:#0C0B26; --carta:#1A1948; --carta-2:#221F55;
  --tinta:#F6F2F1; --tinta-suave:#A9A5BE; --linea:#2B2974;
  --n1-bg:#221F55; --n1-tx:#A9A5BE; --n2-bg:#3B3886; --n2-tx:#EDEAF4;
  --n3-bg:#9D99C4; --n3-tx:#0C0B26; --n4-bg:#F6F2F1; --n4-tx:#0C0B26;
  --sin-bg:#1A1948; --sin-tx:#8F8BA8;
  --rojo:#FF5A6E; --rojo-hover:#FF7585; --ok:#7FD0A8; --aviso:#FBC600;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--font-body);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rojo);outline-offset:2px;border-radius:4px}

/* cabecera */
.top{position:sticky;top:0;z-index:30;background:var(--papel);border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:8px;min-width:0}
.crest{height:26px;width:auto;flex:none}
.marca b{font-family:var(--font-display);font-weight:400;font-size:15px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.marca span{font-size:11px;color:var(--tinta-suave);letter-spacing:.08em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acc{margin-left:auto;display:flex;gap:6px}
.icono{background:none;border:1px solid var(--linea);border-radius:8px;padding:6px 10px;font-size:12px;
  color:var(--tinta-suave);font-weight:600}
.icono:hover{border-color:var(--tinta-suave);color:var(--tinta)}
.barra-act{max-width:720px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;align-items:center;
  overflow-x:auto;scrollbar-width:none}
.barra-act::-webkit-scrollbar{display:none}
.pill{flex:none;font-size:12px;border:1px solid var(--linea);background:var(--carta);border-radius:999px;
  padding:3px 10px;color:var(--tinta-suave);white-space:nowrap}
.pill b{color:var(--tinta);font-weight:600}

/* bloques */
.seccion{margin-top:22px}
.seccion > h2{font-family:var(--font-fuerte);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tinta-suave);margin-bottom:8px}
.carta{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.vacio{padding:18px;color:var(--tinta-suave);font-size:14px}

/* lista de deportistas */
.dep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--linea);padding:13px 14px}
.dep:last-child{border-bottom:0}
.dep:hover{background:var(--carta-2)}
.dep-id{font-size:11px;color:var(--tinta-suave);font-variant-numeric:tabular-nums;min-width:46px}
.dep-nom{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tinta-suave);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.prog-barra{width:54px;height:5px;border-radius:3px;background:var(--carta-2);overflow:hidden}
.prog-barra i{display:block;height:100%;background:var(--n3-bg)}
.prog.listo{color:var(--ok);font-weight:600}

/* ficha deportista */
.ficha-top{display:flex;align-items:flex-start;gap:12px;padding:16px 0 8px}
.ficha-top h1{font-family:var(--font-fuerte);font-size:24px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.volver{background:none;border:0;color:var(--tinta-suave);font-size:13px;font-weight:600;padding:6px 0}
.volver:hover{color:var(--rojo)}
.eje-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.eje-h h2{font-family:var(--font-fuerte);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.eje-h span{font-size:12px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}

/* ítem */
.item{border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.item-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.item-head:hover{background:var(--carta-2)}
.item-n{font-size:11px;color:var(--tinta-suave);font-variant-numeric:tabular-nums;min-width:20px}
.item-nom{flex:1;font-weight:600;font-size:15px;min-width:0}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:4px 9px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{font-style:normal;opacity:.65;font-size:10px;font-variant-numeric:tabular-nums}
.chip.sin{background:var(--sin-bg);color:var(--sin-tx);border:1px dashed var(--linea)}
.chip.n1{background:var(--n1-bg);color:var(--n1-tx)} .chip.n2{background:var(--n2-bg);color:var(--n2-tx)}
.chip.n3{background:var(--n3-bg);color:var(--n3-tx)} .chip.n4{background:var(--n4-bg);color:var(--n4-tx)}
.item-body{padding:2px 14px 16px;border-top:1px solid var(--linea);background:var(--carta-2)}
.mira{font-size:14px;color:var(--tinta-suave);margin:12px 0 0}
.decide{margin:12px 0 0;padding:10px 12px;background:var(--carta);border:1px solid var(--linea);border-radius:8px}
.decide p{margin:0;font-size:13px}
.decide p + p{margin-top:7px;padding-top:7px;border-top:1px dotted var(--linea)}
.decide b{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave);
  display:block;margin-bottom:1px}
.niveles{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.niv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--carta);
  border:1px solid var(--linea);border-radius:8px;padding:10px 12px}
.niv:hover{border-color:var(--tinta-suave)}
.niv .marca-n{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:800;
  font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.niv.v1 .marca-n{background:var(--n1-bg);color:var(--n1-tx)} .niv.v2 .marca-n{background:var(--n2-bg);color:var(--n2-tx)}
.niv.v3 .marca-n{background:var(--n3-bg);color:var(--n3-tx)} .niv.v4 .marca-n{background:var(--n4-bg);color:var(--n4-tx)}
.niv strong{font-size:14px;font-weight:700;display:block}
.niv em{font-style:normal;font-size:12px;color:var(--tinta-suave);display:block}
.niv[aria-pressed="true"]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.niv[aria-pressed="true"]::after{content:"✓";margin-left:auto;font-weight:800;color:var(--tinta)}
.item-pie{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.enlace{background:none;border:0;padding:4px 0;font-size:13px;font-weight:600;color:var(--rojo);text-decoration:underline;
  text-underline-offset:3px}
.enlace.gris{color:var(--tinta-suave)}

/* campos */
.campo{padding:14px}
.campo label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tinta-suave);margin-bottom:6px}
.campo .ayuda{font-size:12px;color:var(--tinta-suave);margin:-2px 0 8px}
textarea,input[type=text],input[type=date],select{width:100%;background:var(--papel);color:var(--tinta);
  border:1px solid var(--linea);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-sel{border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:6px 12px;font-size:13px;
  font-weight:600;color:var(--tinta-suave)}
.chip-sel[aria-pressed="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.instalar{padding:14px 16px;margin-bottom:16px;border-left:4px solid var(--rojo)}
.instalar h3{font-size:16px;margin:0 0 4px}
.instalar ol{margin:10px 0 0;padding-left:22px}
.instalar li{margin:7px 0;line-height:1.4}
.instalar svg{width:18px;height:18px;vertical-align:-3px;margin:0 2px}
.instalar .fila{margin-top:12px}
.btn{background:var(--rojo);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--rojo-hover)}
.btn.sec{background:none;color:var(--tinta);border:1px solid var(--linea)}
.btn.sec:hover{border-color:var(--tinta-suave);background:var(--carta-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fila-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:430px){.fila-2{grid-template-columns:1fr}.prog-barra{display:none}.dep-id{min-width:40px}}
@media(max-width:560px){#sub-marca{display:none}}

/* hoja de guía */
.hoja{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.hoja[hidden]{display:none}
.hoja-fondo{position:absolute;inset:0;background:rgba(10,11,13,.5)}
.hoja-caja{position:relative;background:var(--papel);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;border:1px solid var(--linea);border-bottom:0;
  padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.hoja-top{position:sticky;top:0;background:var(--papel);padding:14px 0 10px;border-bottom:1px solid var(--linea);
  display:flex;align-items:flex-start;gap:12px;z-index:2}
.hoja-top h2{font-family:var(--font-fuerte);font-size:20px;font-weight:700;flex:1}
.hoja-top .eje-tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);
  display:block;margin-bottom:2px}
.g-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-suave);
  margin:18px 0 6px}
.hoja-caja p{margin:0;font-size:14px}
.hoja-caja ul{margin:0;padding-left:18px;font-size:14px}
.hoja-caja li{margin-bottom:5px}
.nivel-g{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--linea)}
.nivel-g .marca-n{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.nivel-g.e1 .marca-n{background:var(--n1-bg);color:var(--n1-tx)} .nivel-g.e2 .marca-n{background:var(--n2-bg);color:var(--n2-tx)}
.nivel-g.e3 .marca-n{background:var(--n3-bg);color:var(--n3-tx)} .nivel-g.e4 .marca-n{background:var(--n4-bg);color:var(--n4-tx)}
.nivel-g.actual{background:var(--carta);box-shadow:inset 3px 0 0 var(--rojo);padding-left:10px;margin-left:-10px;
  border-radius:0 6px 6px 0}
.nivel-g strong{font-size:13px;display:block;margin-bottom:2px}
.nivel-g p{font-size:13px;color:var(--tinta-suave)}
table.cat{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.cat th,table.cat td{text-align:left;vertical-align:top;padding:8px 10px;border:1px solid var(--linea)}
table.cat th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);font-weight:700;
  background:var(--carta-2)}
table.cat tr.actual td,table.cat tr.actual th{background:var(--carta);box-shadow:inset 0 0 0 1px var(--tinta-suave)}
.reglas{background:var(--carta);border:1px solid var(--linea);border-radius:8px;padding:12px 14px;margin-top:18px}
.reglas li{font-size:13px;color:var(--tinta-suave)}
.aviso{font-size:13px;color:var(--aviso);background:var(--carta);border:1px solid var(--linea);
  border-left:3px solid var(--aviso);border-radius:0 8px 8px 0;padding:10px 12px}
.nota{font-size:13px;color:var(--tinta-suave)}
.pie-fijo{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--papel) 70%,transparent);
  padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.pie-in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.pie-in .btn{flex:1}
.sync{font-size:11px;color:var(--tinta-suave);text-align:center;padding:10px 0 0}
.oculto{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="marca"><img src="fonts/crest.png" alt="" class="crest"><b>Hockey España</b><span id="sub-marca">Radar de Desarrollo</span></div>
    <div class="top-acc">
      <button class="icono" id="btn-preparar">Actividad</button>
      <button class="icono" id="btn-ajustes">Ajustes</button>
    </div>
  </div>
  <div class="barra-act" id="barra-act"></div>
</header>
<main class="wrap" id="app"></main>
<div class="pie-fijo oculto" id="pie"><div class="pie-in" id="pie-in"></div></div>

<div class="hoja" id="hoja" hidden>
  <div class="hoja-fondo" data-cerrar></div>
  <div class="hoja-caja" id="hoja-caja" role="dialog" aria-modal="true" aria-label="Guía del ítem"></div>
</div>

<script>
"use strict";
const NIVELES = [
  {n:1, nombre:"Prioridad de mejora", cad:"Rara vez"},
  {n:2, nombre:"A mejorar",           cad:"A veces; depende de la tarea"},
  {n:3, nombre:"Competente",          cad:"La mayoría de las veces"},
  {n:4, nombre:"Fortaleza",           cad:"Casi siempre, también bajo presión alta"}
];
const EJES = [
  {id:"TÉCNICO", corto:"Técnico"},
  {id:"TÁCTICO-DECISIONAL", corto:"Táctico-decisional"},
  {id:"MINDSET", corto:"Mindset"}
];
const ESPECIALIDADES = ["Tirador de PC","Sacador de PC","Parador de PC","Defensa de PC","Stroke","Shoot-out","Polivalencia"];
const CLAVE = "radar-he-v1";
const SIN_DATOS = {observador:"", rol:"", actividades:{}, actual:null, val:{}, demo:true};
const ROLES = ["Seleccionador", "Asistente", "Técnico de apoyo"];

let ITEMS = [];
let S = cargar();
let vista = {n:"grupo", dep:null, abierto:null};
let idActividadPendiente = null;

/* ---------- almacenamiento local ---------- */
function cargar(){
  try{
    const raw = localStorage.getItem(CLAVE);
    if(raw) return Object.assign({}, SIN_DATOS, JSON.parse(raw));
  }catch(e){}
  return JSON.parse(JSON.stringify(SIN_DATOS));
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){}
}
function uuid(){ return "e"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }

/* ---------- datos de ejemplo ---------- */
function actividadEjemplo(){
  return {
    id:"EJEMPLO", nombre:"Ejemplo · Stage de prueba", fecha:new Date().toISOString().slice(0,10),
    grupo:"Sub-16 Masculino", categoria:"sub16", ejemplo:true,
    deportistas:[1,2,3,4,5,6].map(i=>({id:"EJ-"+i, nombre:"Deportista de ejemplo "+i}))
  };
}
function asegurarEjemplo(){
  if(S.demo && Object.keys(S.actividades).length===0){
    const a = actividadEjemplo(); S.actividades[a.id]=a; S.actual=a.id; guardar();
  }
}

/* ---------- acceso a las observaciones ---------- */
function act(){ return S.actividades[S.actual] || null; }
function vdep(depId){
  const a = act(); if(!a) return null;
  S.val[a.id] = S.val[a.id] || {};
  if(!S.val[a.id][depId]) S.val[a.id][depId] = {items:{}, com:{}, rasgo:"", esp:[]};
  return S.val[a.id][depId];
}
function hechos(depId){
  const a = act(); if(!a) return 0;
  const v = (S.val[a.id]||{})[depId]; if(!v) return 0;
  return Object.values(v.items).filter(x=>x>=1&&x<=4).length;
}
function itemsDe(eje){ return ITEMS.filter(i=>i.eje===eje); }
function item(n){ return ITEMS.find(i=>i.n===n); }

/* ---------- utilidades ---------- */
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function esc(s){ return String(s==null?"":s); }
function chipNivel(v){
  const c = el("span","chip "+(v?("n"+v):"sin"));
  if(v){ c.append(document.createTextNode(NIVELES[v-1].nombre)); const i=el("i",null,String(v)); c.append(i); }
  else c.textContent = "Sin situar";
  return c;
}

/* ---------- cabecera ---------- */
function pintarBarra(){
  const b = document.getElementById("barra-act"); b.textContent="";
  const a = act();
  if(!a){ b.append(Object.assign(el("span","pill"),{textContent:"Sin actividad cargada"})); return; }
  const p1 = el("span","pill"); p1.append(el("b",null,a.grupo)); b.append(p1);
  const p2 = el("span","pill", a.nombre + " · " + a.fecha); b.append(p2);
  if(a.ejemplo){ const p3=el("span","pill","Datos de ejemplo"); p3.style.color="var(--aviso)"; b.append(p3); }
  if(S.observador){ b.append(el("span","pill", S.observador)); }
}

/* ---------- vista: grupo ---------- */
function vistaGrupo(app){
  const a = act();
  const h = el("div","ficha-top");
  const t = el("h1", null, a ? a.grupo : "Radar de Desarrollo");
  h.append(t); app.append(h);
  const ins = avisoInstalar(); if(ins) app.append(ins);
  if(!a){
    const c = el("div","carta vacio");
    c.append(el("p",null,"No hay ninguna actividad en este dispositivo. Pide al Área de Alto Rendimiento el código de la actividad y pégalo en Actividad."));

  /* rasgo diferencial + especialización */

  c2.append(el("label",null,"Especialización"));
  c2.append(el("p","ayuda","Ninguna, una o varias. No entra en el Radar: queda para el seguimiento."));
  const chips = el("div","chips");
  ESPECIALIDADES.forEach(e=>{
    const b = el("button","chip-sel", e); b.type="button";
    const on = (v.esp||[]).includes(e);
    b.setAttribute("aria-pressed", on?"true":"false");
    b.addEventListener("click", ()=>{
      v.esp = v.esp||[];
      const i = v.esp.indexOf(e);
      if(i>=0) v.esp.splice(i,1); else v.esp.push(e);
      b.setAttribute("aria-pressed", v.esp.includes(e)?"true":"false");

    });

  });
  c2.append(chips); c.append(c2); s.append(c); app.append(s);

  /* navegación entre deportistas */

  const bLista = el("button","btn sec","Grupo"); bLista.type="button";

  const bSig = el("button","btn", idx===a.deportistas.length-1 ? "Terminar" : "Siguiente ›"); bSig.type="button";

    if(idx===a.deportistas.length-1){ vista={n:"grupo"}; } else { vista={n:"ficha", dep:a.deportistas[idx+1].id}; }
    pintar(); window.scrollTo(0,0);
  });
  pin.append(bAnt,bLista,bSig);
}

function filaItem(it, v, d){
  const art = el("article","item");
  const head = el("button","item-head"); head.type="button";
  head.setAttribute("aria-expanded", vista.abierto===it.n ? "true":"false");
  head.append(el("span","item-n", String(it.n).padStart(2,"0")));
  head.append(el("span","item-nom", it.nombre));
  head.append(chipNivel(v.items[it.n]));
  head.addEventListener("click", ()=>{
    vista.abierto = (vista.abierto===it.n) ? null : it.n;
    pintar();
    if(vista.abierto===it.n){
      const n = document.querySelector('[data-item="'+it.n+'"]');
      if(n) n.scrollIntoView({block:"center", behavior:"smooth"});
    }
  });
  art.append(head);
  if(vista.abierto!==it.n) return art;

  const body = el("div","item-body"); body.setAttribute("data-item", it.n);
  body.append(el("p","mira", it.mira));

  const dec = el("div","decide");
  const p1 = el("p"); p1.append(el("b",null,"¿A mejorar o competente?"), document.createTextNode(it.q[0]));
  const p2 = el("p"); p2.append(el("b",null,"¿Competente o fortaleza?"), document.createTextNode(it.q[1]));
  dec.append(p1,p2); body.append(dec);

  const nivs = el("div","niveles");
  NIVELES.forEach(N=>{
    const b = el("button","niv v"+N.n); b.type="button";
    b.setAttribute("aria-pressed", v.items[it.n]===N.n ? "true":"false");
    b.append(el("span","marca-n", String(N.n)));
    const txt = el("span");
    txt.append(el("strong",null,N.nombre), el("em",null,N.cad));
    b.append(txt);
    b.addEventListener("click", ()=>{
      v.items[it.n] = (v.items[it.n]===N.n) ? undefined : N.n;
      if(v.items[it.n]===undefined) delete v.items[it.n];
      guardarYSync(d.id);
      const sig = siguienteItem(it.n, v);
      vista.abierto = v.items[it.n] ? sig : it.n;
      pintar();
      if(vista.abierto){
        const nd = document.querySelector('[data-item="'+vista.abierto+'"]');
        if(nd) nd.scrollIntoView({block:"center", behavior:"smooth"});
      }
    });
    nivs.append(b);
  });
  body.append(nivs);

  const pie = el("div","item-pie");
  const g = el("button","enlace","Guía de este ítem"); g.type="button";
  g.addEventListener("click", ()=>abrirHoja(it.n, v.items[it.n]));
  pie.append(g);
  if(v.items[it.n]){
    const s = el("button","enlace gris","Dejar sin situar"); s.type="button";
    s.addEventListener("click", ()=>{ delete v.items[it.n]; guardarYSync(d.id); pintar(); });
    pie.append(s);
  }
  body.append(pie);
  art.append(body);
  return art;
}
function siguienteItem(n, v){
  for(let k=n+1;k<=20;k++){ if(!v.items[k]) return k; }
  for(let k=1;k<n;k++){ if(!v.items[k]) return k; }
  return null;
}

  caja.append(el("div","g-h","Cómo se ve en cada nivel"));
  NIVELES.forEach(N=>{

    trh.append(el("th",null,""), el("th",null,"Competente"), el("th",null,"Fortaleza"));
    thead.append(trh); tb.append(thead);
    const tbody = el("tbody");
    [["sub15","Sub-15"],["sub16","Sub-16"]].forEach(([k,lab])=>{
      const tr = el("tr", k===cat ? "actual" : null);
      tr.append(el("th",null,lab), el("td",null,it.cat[k].competente), el("td",null,it.cat[k].fortaleza));
      tbody.append(tr);
    });
    tb.append(tbody); caja.append(tb);
  }
  if(it.nota){
    caja.append(el("div","g-h","Según la categoría"));
    caja.append(el("p","nota", it.nota));

  const reglas = el("div","reglas");

   ["Mínimo de observación: sitúa un ítem solo si lo has visto en al menos dos sesiones, una de ellas con oposición real."],
   ["Un ítem, una conducta. Cada ítem se lee por lo que define, no por la impresión general."],
   ["La categoría cambia la exigencia, no la conducta: la misma acción puede ser Competente en Sub-15 y A mejorar en Sub-16."],
   ["El nivel compara al deportista con lo que se espera de su categoría, nunca con el resto del grupo. No hay cupos."]
  ].forEach(([t])=>ur.append(el("li",null,t)));
  reglas.append(ur); caja.append(reglas);

  document.getElementById("hoja").hidden = false;
  document.body.style.overflow = "hidden";

/* ---------- vista: preparar actividad ---------- */
function vistaPreparar(app){

  app.append(volver);
  const topP = el("div","ficha-top"); topP.append(el("h1",null,"Actividad")); app.append(topP);

  /* cargar por código */
  const s1 = el("section","seccion");

  c1.append(el("p","ayuda","Pega el código que te manda el Área de Alto Rendimiento. Se queda guardado en este móvil."));

  const msg1 = el("span","nota","");

    try{
      const a = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
      if(!a.id || !Array.isArray(a.deportistas)) throw new Error("formato");
      S.actividades[a.id]=a; S.actual=a.id; S.demo=false;

  });

  s2.append(el("h2",null,"Preparar una actividad (Área de Alto Rendimiento)"));

    if(k==="fecha") i.value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);  // fecha local, no UTC
    campos[k]=i; d.append(i); g.append(d);
  });
  const drol = el("div");
  const lrol = el("label",null,"Rol de quien lo recibe"); lrol.setAttribute("for","c-rol"); drol.append(lrol);
  const selR = el("select"); selR.id="c-rol";
  ROLES.forEach(r=>{ const o=el("option",null,r); o.value=r; selR.append(o); });
  campos.rol = selR; drol.append(selR);

  const l2 = el("label",null,"Deportistas"); l2.style.marginTop="14px"; l2.setAttribute("for","c-deps"); c2.append(l2);
  c2.append(el("p","ayuda","Una por línea: usuario de Kitman y nombre, separados por coma o tabulador. El usuario de Kitman (la columna KUserName del archivo de importación) es lo que permite llevar después los niveles a Kitman sin cruzar nada a mano."));
  const tad = el("textarea"); tad.id="c-deps"; tad.placeholder="nombreusuario, Nombre Apellido\notrousuario, Nombre Apellido";
  c2.append(tad);
  const f2 = el("div","fila"); f2.style.marginTop="12px";

    const deps = tad.value.split("\n").map(l=>l.trim()).filter(Boolean).map((l,i)=>{
      const p = l.split(/[\t,;]+/).map(x=>x.trim()).filter(Boolean);
      if(p.length>=2) return {id:p[0], nombre:p.slice(1).join(" ")};
      return {id:"D"+String(i+1).padStart(2,"0"), nombre:p[0]};

    delete S.actividades["EJEMPLO"];
    guardar(); vista={n:"grupo"}; pintar(); window.scrollTo(0,0);
  });
  f2.append(b2,msg2); c2.append(f2,salida,f3); s2.append(c2); app.append(s2);

  /* cambiar de actividad */
  const ids = Object.keys(S.actividades);
  if(ids.length>1){
    const s3 = el("section","seccion");
    s3.append(el("h2",null,"Actividades en este dispositivo"));

      b.addEventListener("click", ()=>{ S.actual=id; guardar(); vista={n:"grupo"}; pintar(); window.scrollTo(0,0); });
      c3.append(b);
    });
    s3.append(c3); app.append(s3);
  }
}

/* ---------- exportar ---------- */
function filasCSV(){
  const a = act(); const out = [];
  const cab = ["actividad_id","actividad","fecha","grupo","categoria","deportista_id","deportista",
               "observador","eje","item_n","item","nivel","nivel_texto","comentario_eje","rasgo_diferencial","especializacion"];
  out.push(cab);
  a.deportistas.forEach(d=>{
    const v = (S.val[a.id]||{})[d.id]; if(!v) return;
    ITEMS.forEach(it=>{
      const n = v.items[it.n];
      out.push([a.id,a.nombre,a.fecha,a.grupo,a.categoria,d.id,d.nombre,S.observador||"",
        it.eje,it.n,it.nombre, n||"", n?NIVELES[n-1].nombre:"Sin situar",
        (v.com&&v.com[it.eje])||"", v.rasgo||"", (v.esp||[]).join(" | ")]);
    });
  });
  return out;
}
function aCSV(filas){
  return filas.map(f=>f.map(c=>{
    const s = String(c==null?"":c);
    return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";")).join("\r\n");
}
function paqueteJSON(){
  const a = act();
  return {
    actividad:{id:a.id,nombre:a.nombre,fecha:a.fecha,grupo:a.grupo,categoria:a.categoria},
    observador:S.observador||"",
    generado:new Date().toISOString(),
    escala:NIVELES.map(n=>({n:n.n,nombre:n.nombre})),
    deportistas:a.deportistas.map(d=>{
      const v = (S.val[a.id]||{})[d.id] || {items:{},com:{},rasgo:"",esp:[]};
      return {id:d.id, nombre:d.nombre, rasgo_diferencial:v.rasgo||"", especializacion:v.esp||[],
        comentarios:v.com||{},
        items:ITEMS.map(it=>({n:it.n, eje:it.eje, item:it.nombre,
          nivel:v.items[it.n]||null, nivel_texto:v.items[it.n]?NIVELES[v.items[it.n]-1].nombre:null}))};
    })
  };
}
async function exportar(tipo){
  const a = act(); if(!a) return;
  const base = "Radar_"+a.grupo.replace(/[^A-Za-z0-9]+/g,"-")+"_"+a.fecha;
  const datos = tipo==="csv" ? "﻿"+aCSV(filasCSV()) : JSON.stringify(paqueteJSON(), null, 1);
  const nombre = base + (tipo==="csv" ? ".csv" : ".json");
  descargar(nombre, datos, tipo==="csv" ? "text/csv;charset=utf-8" : "application/json;charset=utf-8");
}
function descargar(nombre, datos, tipoMime){
  try{
    const url = URL.createObjectURL(new Blob([datos], {type:tipoMime}));
    const a2 = document.createElement("a"); a2.href=url; a2.download=nombre;
    document.body.append(a2); a2.click(); a2.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ mostrarTexto(nombre, datos); }
}
function mostrarTexto(nombre, datos){
  const caja = document.getElementById("hoja-caja"); caja.textContent="";

const CFG = window.RADAR_CONFIG || {};
let msalApp = null, cuentaMS = null;

function spConfigurado(){
  return !!(CFG.clientId && CFG.tenantId && CFG.siteHost && CFG.sitePath && CFG.listName);
}

async function cargarMsal(){
  if(window.msal) return window.msal;
  await new Promise((ok, err)=>{
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.26.0/lib/msal-browser.min.js";
    sc.onload = ok;
    sc.onerror = ()=>err(new Error("No se ha podido cargar el inicio de sesión de Microsoft. Comprueba la conexión."));
    document.head.append(sc);
  });
  return window.msal;
}
async function iniciarMsal(){
  if(!spConfigurado()) throw new Error("Falta configurar config.js con los datos de Entra y SharePoint.");
  const M = await cargarMsal();
  if(!msalApp){
    msalApp = new M.PublicClientApplication({
      auth:{ clientId:CFG.clientId,
             authority:"https://login.microsoftonline.com/"+CFG.tenantId,
             redirectUri: location.origin + location.pathname.replace(/index\.html$/i,"") },
      cache:{ cacheLocation:"localStorage" }
    });
    if(msalApp.initialize) await msalApp.initialize();
    const r = await msalApp.handleRedirectPromise();
    if(r && r.account) msalApp.setActiveAccount(r.account);
    const todas = msalApp.getAllAccounts();
    if(todas.length && !msalApp.getActiveAccount()) msalApp.setActiveAccount(todas[0]);
  }
  cuentaMS = msalApp.getActiveAccount();
  return msalApp;
}
function ambitos(){ return (CFG.scopes && CFG.scopes.length) ? CFG.scopes : ["Sites.ReadWrite.All"]; }
async function entrarMS(){
  await iniciarMsal();
  if(cuentaMS) return cuentaMS;
  await msalApp.loginRedirect({scopes:ambitos()});
}
async function salirMS(){
  await iniciarMsal();
  if(!cuentaMS) return;
  await msalApp.logoutRedirect({account:cuentaMS});
}
async function tokenMS(){
  await iniciarMsal();
  if(!cuentaMS){ await msalApp.loginRedirect({scopes:ambitos()}); throw new Error("Hay que iniciar sesión."); }
  try{
    const r = await msalApp.acquireTokenSilent({scopes:ambitos(), account:cuentaMS});
    return r.accessToken;
  }catch(e){
    await msalApp.acquireTokenRedirect({scopes:ambitos(), account:cuentaMS});
    throw e;
  }
}
async function graph(ruta, opciones){
  const t = await tokenMS();
  const cab = Object.assign({Authorization:"Bearer "+t, "Content-Type":"application/json"},
                            (opciones && opciones.headers) || {});
  const destino = /^https:\/\/graph\.microsoft\.com\//.test(ruta) ? ruta : "https://graph.microsoft.com/v1.0"+ruta;
  const r = await fetch(destino, Object.assign({}, opciones, {headers:cab}));
  if(!r.ok){
    const txt = (await r.text()).slice(0,300);
    if(r.status===403) throw new Error("Tu cuenta no tiene permiso en esa lista.");
    throw new Error("Microsoft Graph "+r.status+". "+txt);
  }
  return r.json();
}
let idsSitio = null;
async function resolverLista(){
  if(idsSitio) return idsSitio;
  const sitio = await graph("/sites/"+CFG.siteHost+":"+CFG.sitePath);
  const listas = await graph("/sites/"+sitio.id+"/lists?$select=id,displayName,name");
  const l = listas.value.find(x=>x.displayName===CFG.listName || x.name===CFG.listName);
  if(!l) throw new Error("No encuentro la lista «"+CFG.listName+"» en ese sitio.");
  idsSitio = {sitio:sitio.id, lista:l.id};
  return idsSitio;
}
function filaSP(a, d, v){

    Payload: JSON.stringify({items:v.items, com:v.com||{}, rasgo:v.rasgo||"", esp:v.esp||[]})
  };

async function enviarSharePoint(paso){
  const a = act();
  if(!a) throw new Error("No hay actividad cargada.");
  if(a.ejemplo) throw new Error("La actividad de ejemplo no se envía. Carga una actividad real.");
  if(!S.observador) throw new Error("Pon tu nombre en Ajustes antes de enviar.");
  const ids = await resolverLista();
  let n = 0, total = a.deportistas.filter(d=>{
    const v=(S.val[a.id]||{})[d.id]; return v && Object.keys(v.items).length;
  }).length;
  if(!total) throw new Error("Todavía no has situado ningún ítem.");
  for(const d of a.deportistas){
    const v = (S.val[a.id]||{})[d.id];
    if(!v || !Object.keys(v.items).length) continue;
    await graph("/sites/"+ids.sitio+"/lists/"+ids.lista+"/items",
                {method:"POST", body:JSON.stringify({fields:filaSP(a,d,v)})});
    n++; if(paso) paso(n, total);
  }
  S.enviado = S.enviado || {};
  S.enviado[a.id] = new Date().toISOString();
  guardar();
  return n;
}

/* ---------- archivo para Kitman (Área de Alto Rendimiento) ----------
   Formato del archivo de importación de Kitman: una fila por deportista, primera columna
   KUserName (usuario de Kitman) y una columna por ítem con el sufijo « - Import».
   Regla (César, 22/11/2026): media entre el seleccionador y su asistente. */
const KITMAN = Object.assign({clave:"KUserName", sufijo:" - Import", roles:["Seleccionador","Asistente"]}, CFG.kitman || {});
let kit = {regs:null, origen:"", act:null, msg:"", aviso:false, ocupado:false};

function registrosLocales(){
  const out = [];
  Object.values(S.actividades).forEach(a=>{
    if(a.ejemplo) return;
    a.deportistas.forEach(d=>{
      const v = (S.val[a.id]||{})[d.id];
      if(!v || !Object.keys(v.items).length) return;
      out.push({actividadId:a.id, actividad:a.nombre, fecha:a.fecha, grupo:a.grupo, deportistaId:d.id,
                observador:S.observador||"", rol:S.rol||"", quien:"este-dispositivo",
                actualizado:new Date().toISOString(), niveles:Object.assign({}, v.items)});
    });
  });
  return out;
}
async function registrosLista(paso){
  const ids = await resolverLista();
  const campos = ["ActividadId","Actividad","Fecha","Grupo","DeportistaId","Observador","Rol","Actualizado"];
  for(let n=1;n<=20;n++) campos.push("Nivel"+String(n).padStart(2,"0"));
  let url = "/sites/"+ids.sitio+"/lists/"+ids.lista+"/items?$top=500&$expand=fields($select="+campos.join(",")+")";
  const out = []; let paginas = 0;
  while(url && paginas < 40){
    const r = await graph(url); paginas++;
    (r.value||[]).forEach(x=>{
      const f = x.fields || {};
      if(!f.ActividadId || !f.DeportistaId) return;
      const niveles = {};
      for(let n=1;n<=20;n++){ const v = Number(f["Nivel"+String(n).padStart(2,"0")]); if(v>=1 && v<=4 && Number.isInteger(v)) niveles[n]=v; }
      const autor = x.createdBy && x.createdBy.user ? (x.createdBy.user.email || x.createdBy.user.id || "") : "";
      out.push({actividadId:String(f.ActividadId), actividad:f.Actividad||"", fecha:String(f.Fecha||"").slice(0,10), grupo:f.Grupo||"",
                deportistaId:String(f.DeportistaId).trim(), observador:f.Observador||"", rol:f.Rol||"",
                quien:(autor || f.Observador || "sin-nombre").toLowerCase(),
                actualizado:f.Actualizado || x.lastModifiedDateTime || "", niveles});
    });
    url = r["@odata.nextLink"] || null;
    if(paso) paso(out.length);
  }
  return out;
}
function actividadesDe(regs){
  const m = new Map();
  regs.forEach(r=>{
    const a = m.get(r.actividadId) || {id:r.actividadId, nombre:r.actividad, fecha:r.fecha, grupo:r.grupo, n:0};
    a.n++; m.set(r.actividadId, a);
  });
  return [...m.values()].sort((a,b)=> a.fecha<b.fecha ? 1 : a.fecha>b.fecha ? -1 : 0);
}
function archivoKitman(regs, actividadId){
  /* 1) de cada observador, su envío más reciente por deportista */
  const ultimo = new Map();
  regs.filter(r=>r.actividadId===actividadId).forEach(r=>{
    const k = r.deportistaId+"\u0001"+r.quien, p = ultimo.get(k);
    if(!p || String(r.actualizado) > String(p.actualizado)) ultimo.set(k, r);
  });
  const todos = [...ultimo.values()];
  const dentro = todos.filter(r=>KITMAN.roles.includes(r.rol));
  const fuera  = todos.filter(r=>!KITMAN.roles.includes(r.rol));
  const observadores = lista=>{
    const m = new Map();
    lista.forEach(r=>{ const o = m.get(r.quien) || {nombre:r.observador||r.quien, rol:r.rol||"Sin indicar", n:0}; o.n++; m.set(r.quien, o); });
    return [...m.values()];
  };
  /* 2) columnas con el nombre de Kitman, en el mismo orden que su archivo */
  const cols = ITEMS.map(it=>({n:it.n, item:it.nombre, cab:(it.kitman||it.nombre)+KITMAN.sufijo}))
                    .sort((a,b)=> a.cab<b.cab ? -1 : a.cab>b.cab ? 1 : 0);
  const porDep = new Map();
  dentro.forEach(r=>{ if(!porDep.has(r.deportistaId)) porDep.set(r.deportistaId, []); porDep.get(r.deportistaId).push(r); });
  /* 3) media por deportista e ítem; el ítem que nadie ha situado queda en blanco */
  const filas = [[KITMAN.clave].concat(cols.map(c=>c.cab))];
  let medias = 0, blancos = 0; const lejos = [];
  [...porDep.keys()].sort().forEach(id=>{
    const rs = porDep.get(id);
    filas.push([id].concat(cols.map(c=>{
      const vs = rs.map(r=>r.niveles[c.n]).filter(v=>v>=1 && v<=4);
      if(!vs.length){ blancos++; return ""; }
      const m = vs.reduce((x,y)=>x+y, 0) / vs.length;
      if(!Number.isInteger(m)) medias++;
      if(Math.max.apply(null,vs) - Math.min.apply(null,vs) >= 2) lejos.push({id, item:c.item, valores:vs.join(" y ")});
      return String(Math.round(m*100)/100);
    })));
  });
  const raros = [...porDep.keys()].filter(id=>!/^[a-z0-9._-]+$/.test(id));
  return {filas, deportistas:porDep.size, dentro:observadores(dentro), fuera:observadores(fuera), medias, blancos, lejos, raros};
}
function csvKitman(filas){
  return filas.map(f=>f.map(c=>{
    const s = String(c==null?"":c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\n") + "\n";
}
function vistaKitman(app){
  const volver = el("button","volver","‹ Volver"); volver.type="button";
  volver.addEventListener("click", ()=>{ vista={n:"ajustes"}; pintar(); });
  app.append(volver);
  const top = el("div","ficha-top"); top.append(el("h1",null,"Archivo para Kitman")); app.append(top);

  const s1 = el("section","seccion");
  s1.append(el("h2",null,"De dónde salen los datos"));
  const c1 = el("div","carta campo");
  c1.append(el("p","nota","La lista de SharePoint reúne los envíos de todos los técnicos. Con una cuenta propietaria del sitio se ven todos; con cualquier otra, solo los propios."));
  const f1 = el("div","fila"); f1.style.marginTop="12px";
  const estado = el("p","nota", kit.msg); estado.style.marginTop="10px";
  if(kit.aviso) estado.style.color="var(--aviso)";
  if(spConfigurado()){
    const bL = el("button","btn","Leer la lista de SharePoint"); bL.type="button"; bL.disabled = kit.ocupado;
    bL.addEventListener("click", async ()=>{
      if(!cuentaMS){ kit.msg="Inicia sesión con Microsoft en Ajustes y vuelve aquí."; kit.aviso=true; pintar(); return; }
      kit.ocupado=true; kit.aviso=false; kit.msg="Leyendo la lista…"; pintar();
      try{
        const regs = await registrosLista();
        kit.regs=regs; kit.origen="lista"; kit.act=null;
        kit.msg = regs.length ? regs.length+" envíos leídos de la lista." : "La lista está vacía, o tu cuenta no ve ningún envío.";
        kit.aviso = !regs.length;
      }catch(e){ kit.msg = e.message; kit.aviso=true; }
      kit.ocupado=false; pintar();
    });
    f1.append(bL);
  }
  const bD = el("button","btn sec","Usar lo que hay en este dispositivo"); bD.type="button"; bD.disabled = kit.ocupado;
  bD.addEventListener("click", ()=>{
    const regs = registrosLocales();
    kit.regs=regs; kit.origen="dispositivo"; kit.act=null;
    kit.msg = regs.length ? "Solo lo observado en este dispositivo: un único observador, sin media." : "En este dispositivo no hay ítems situados en ninguna actividad real.";
    kit.aviso = !regs.length; pintar();
  });
  f1.append(bD); c1.append(f1, estado); s1.append(c1); app.append(s1);

  if(!kit.regs || !kit.regs.length) return;
  const acts = actividadesDe(kit.regs);
  if(!kit.act || !acts.some(a=>a.id===kit.act)) kit.act = acts[0].id;

  const s2 = el("section","seccion");
  s2.append(el("h2",null,"Actividad"));
  const c2 = el("div","carta campo");
  const lab = el("label",null,"Qué actividad llevas a Kitman"); lab.setAttribute("for","k-act"); c2.append(lab);
  const sel = el("select"); sel.id="k-act";
  acts.forEach(a=>{ const o = el("option",null,[a.grupo, a.nombre, a.fecha].filter(Boolean).join(" · ")); o.value=a.id; sel.append(o); });
  sel.value = kit.act;
  sel.addEventListener("change", ()=>{ kit.act=sel.value; pintar(); });
  c2.append(sel); s2.append(c2); app.append(s2);

  const r = archivoKitman(kit.regs, kit.act);
  const a = acts.find(x=>x.id===kit.act);
  const s3 = el("section","seccion");
  s3.append(el("h2",null,"Qué va en el archivo"));
  const c3 = el("div","carta campo");
  const linea = (txt, aviso)=>{ const p = el("p","nota",txt); p.style.marginTop="6px"; if(aviso) p.style.color="var(--aviso)"; c3.append(p); };
  const nombres = lista=>lista.map(o=>o.nombre+" ("+o.rol+", "+o.n+")").join(" · ");
  linea(r.deportistas+" deportistas, 20 ítems. Los ítems sin situar quedan en blanco: "+r.blancos+" casillas.");
  if(r.dentro.length) linea("Entran en la media: "+nombres(r.dentro)+".");
  else linea("Ningún envío de esta actividad viene de un seleccionador o un asistente: el archivo saldría vacío. Revisa el rol en Ajustes.", true);
  if(r.fuera.length) linea("No entran, por su rol: "+nombres(r.fuera)+".", true);
  if(r.medias) linea(r.medias+" casillas llevan una media con decimales (por ejemplo 2.5), porque los dos observadores no coinciden.");
  if(r.lejos.length){
    linea("Dos o más niveles de diferencia entre observadores en "+r.lejos.length+" casillas. Conviene hablarlo antes de importar, porque la media lo tapa:", true);
    r.lejos.slice(0,12).forEach(x=>linea("· "+x.id+" · "+x.item+": "+x.valores));
    if(r.lejos.length>12) linea("· … y "+(r.lejos.length-12)+" más.");
  }
  if(r.raros.length) linea("No parecen usuarios de Kitman (llevan mayúsculas, espacios o acentos): "+r.raros.slice(0,8).join(", ")+(r.raros.length>8?"…":"")+". Kitman no los reconocerá.", true);
  linea("La fecha no va en el archivo: se indica en Kitman al importar.");
  const f3 = el("div","fila"); f3.style.marginTop="12px";
  const bG = el("button","btn","Descargar archivo para Kitman"); bG.type="button"; bG.disabled = !r.deportistas;
  bG.addEventListener("click", ()=>{
    const nombre = "IMPORT_Radar_"+String(a.grupo||a.id).replace(/[^A-Za-z0-9]+/g,"-")+"_"+(a.fecha||"")+".csv";
    descargar(nombre, csvKitman(r.filas), "text/csv;charset=utf-8");
  });
  f3.append(bG); c3.append(f3); s3.append(c3); app.append(s3);
}

/* ---------- render ---------- */
function pintar(){
  const app = document.getElementById("app"); app.textContent="";
  document.getElementById("pie").classList.add("oculto");
  pintarBarra();
  if(vista.n==="grupo") vistaGrupo(app);
  else if(vista.n==="ficha") vistaFicha(app);
  else if(vista.n==="preparar") vistaPreparar(app);
  else if(vista.n==="ajustes") vistaAjustes(app);
  else if(vista.n==="kitman") vistaKitman(app);
}
document.getElementById("btn-preparar").addEventListener("click", ()=>{ vista={n:"preparar"}; pintar(); window.scrollTo(0,0); });
document.getElementById("btn-ajustes").addEventListener("click", ()=>{ vista={n:"ajustes"}; pintar(); window.scrollTo(0,0); });
document.getElementById("hoja").addEventListener("click", (ev)=>{ if(ev.target.closest("[data-cerrar]")) cerrarHoja(); });
document.addEventListener("keydown", (ev)=>{ if(ev.key==="Escape") cerrarHoja(); });

/* ---------- arranque ---------- */
(async function(){
  try{
    const r = await fetch("items.json");
    ITEMS = await r.json();
  }catch(e){
    document.getElementById("app").append(el("div","aviso","No se han podido cargar los 20 ítems del Radar. Vuelve a abrir la página."));
    return;

  asegurarEjemplo();
  pintar();
  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("sw.js"); }catch(e){}
    comprobarLista();
  }
  if(spConfigurado()){
    try{ await iniciarMsal(); actualizarEstadoSync(); pintar(); }catch(e){}
  }
})();
